<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f5f5f5;
        }

        .carte {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .bouton {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="carte">

        <h1>Bienvenue ! 👋</h1>

        <p>
            Bienvenue sur ma page accessible grâce à mon QR code.
        </p>

        <p>
            Tu peux mettre ici du texte, des photos, des liens,
            une présentation, etc.
        </p>

        <a class="bouton" href="https://www.google.com">
            Cliquer ici
        </a>

    </div>

</body>

</html>
